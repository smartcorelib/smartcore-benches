name: bench

# Triggered by:
#   - push to this repo's `main` (harness edits land → re-bench the latest
#     published smartcore so the recorded history reflects both halves).
#   - repository_dispatch from smartcore (event_type: smartcore-dev-push),
#     fired when a commit lands on smartcore's `development` branch.
#   - nightly schedule, so a baseline against the latest published smartcore
#     on crates.io is recorded even when neither repo has recent pushes.
#   - workflow_dispatch (manual rerun). The optional `smartcore_ref` input
#     benches a smartcore branch/SHA checkout instead of the crates.io
#     release (see the checkout steps in each job).
#
# The persisted history tracks the benchmarked library version (smartcore
# from crates.io latest 0.6.x). Harness changes are validated by the
# `harness-check` job in lint.yml; this workflow re-records the baseline
# after such edits so a harness change and a library change are
# distinguishable in the trend charts.
#
# smartcore is resolved from crates.io (latest 0.6.x) — see Cargo.toml.
# A run with `smartcore_ref` set patches in that ref via [patch.crates-io];
# trend history then mixes ref runs with the released baseline, and the
# per-version benches-results storage is skipped for such runs.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [smartcore-dev-push]
  schedule:
    # 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      smartcore_ref:
        description: "smartcore ref to bench (branch or SHA). Empty = crates.io latest 0.6.x."
        required: false
        type: string
        default: ""

# Cancel superseded runs to conserve runner minutes. A ref run is keyed by
# the ref, so two dispatches for the same smartcore ref do not interleave.
concurrency:
  group: bench-${{ github.event_name }}-${{ github.event.client_payload.sha || inputs.smartcore_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  criterion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional ref run: bench a smartcore branch/SHA instead of the
      # crates.io release. Trigger with, e.g.:
      #   gh workflow run bench.yml -f smartcore_ref=main
      # actions/checkout requires paths under $GITHUB_WORKSPACE, so the
      # checkout lands at ./smartcore and a [patch.crates-io] override
      # repoints the dep to it (config paths resolve relative to the
      # project root that owns .cargo/config.toml). Same trick as
      # smartcore's release-bench.yml. The ref's version must satisfy
      # Cargo.toml's `smartcore = "0.6"` or cargo rejects the patch.
      - name: Checkout smartcore at ${{ inputs.smartcore_ref }}
        if: inputs.smartcore_ref != ''
        uses: actions/checkout@v4
        with:
          repository: smartcorelib/smartcore
          ref: ${{ inputs.smartcore_ref }}
          path: smartcore

      # The status check below reports this SHA back to the smartcore commit.
      - name: Resolve smartcore commit SHA
        id: smartref
        if: inputs.smartcore_ref != ''
        run: echo "sha=$(git -C smartcore rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Repoint smartcore dep to the local checkout
        if: inputs.smartcore_ref != ''
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFG'
          [patch.crates-io]
          smartcore = { path = "smartcore" }
          CFG
          # The patch must satisfy Cargo.toml's version requirement or cargo
          # leaves it unused and silently benches the crates.io release
          # ("patch was not used in the crate graph"). Relax the requirement
          # to the ref's major.minor before building.
          ref_mm=$(sed -nE 's/^version = "([0-9]+\.[0-9]+)\.[0-9]+.*$/\1/p' smartcore/Cargo.toml | head -1)
          if [ -z "$ref_mm" ]; then
            echo "::error::could not read smartcore version from smartcore/Cargo.toml" >&2
            exit 1
          fi
          sed -i -E "s/(smartcore = \{ version = \")([^\"]+)(\")/\1${ref_mm}\3/" Cargo.toml
          echo "::notice::Patched smartcore version requirement to ${ref_mm} for the ref run"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: bench-criterion-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: bench-criterion-

      # Compile first so a compile failure fails the job without spending
      # runner minutes on actually running benches.
      - name: Build benches (no-run)
        run: cargo bench --no-run

      # Run criterion benches. `--output-format bencher` emits one line per
      # bench in the format benchmark-action/github-action-benchmark expects
      # for tool=cargo.
      #
      # Each bench is passed explicitly: a bare `cargo bench -- ...` would also
      # execute the iai_* binaries, whose Linux main execs iai-callgrind-runner
      # (not installed in this job). cargo aborts at the first failure —
      # alphabetically `iai_ab` — so every bench sorted after it (iterator_mut,
      # linear, matmul, naive_bayes, svc, svd) never runs. pipefail makes a
      # bench failure fail the step instead of hiding behind tee's exit code.
      #
      # The timing caps keep the whole suite inside ~15 min on shared runners:
      # criterion 0.8 dropped Criterion.toml support, so the budget is set via
      # CLI (3 s warm-up + 5 s measurement defaults cost ~65 s per case; at
      # 0.5 s + 2 s a case costs ~13-20 s). sample-size 20 bounds slow cases
      # (one sample per iteration floor), e.g. svc fits measured in seconds.
      - name: Run criterion benchmarks
        run: |
          set -o pipefail
          mkdir -p bench-output
          cargo bench \
            --bench distance --bench fastpair --bench linear --bench naive_bayes --bench svc \
            --bench matmul --bench ab --bench svd --bench cover_tree --bench iterator_mut \
            --bench random_forest_regressor --bench lasso --bench elastic_net \
            -- --output-format bencher --warm-up-time 0.5 --measurement-time 2 --sample-size 20 \
            | tee bench-output/criterion.json

      # Persist the results to the gh-pages branch and generate the trend
      # page. auto-push: true lets the action commit the JSON directly.
      - name: Store + chart benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output/criterion.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev
          comment-on-alert: true
          # Criterion wall-clock numbers are noisy on GitHub-hosted runners
          # (20-60% variance is normal), so this job is advisory, not a gate.
          fail-on-alert: false
          alert-threshold: "200%"

      - name: Upload criterion.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: criterion-json
          path: bench-output/criterion.json

      # Resolve the exact smartcore version cargo picked from crates.io
      # (read from the Cargo.lock the build step generated). Used as the
      # per-version storage directory name below.
      - name: Resolve smartcore version
        id: smver
        run: |
          if [ -n "${{ inputs.smartcore_ref }}" ]; then
            # Ref run: the patched checkout is what the benches compiled
            # against; read its manifest, not the possibly multi-entry lock.
            ver=$(sed -nE 's/^version = "([^"]+)".*$/\1/p' smartcore/Cargo.toml | head -1)
          else
            ver=$(grep -A1 '^name = "smartcore"$' Cargo.lock | grep version | sed -E 's/version = "([^"]+)".*/\1/' | head -1)
          fi
          if [ -z "$ver" ]; then
            echo "::error::could not resolve smartcore version" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved smartcore v$ver"

      # Persist this run's criterion.json under benches-results/v<version>/.
      # Idempotent: if that version's results are already in the repo, skip.
      # continue-on-error so a storage hiccup (non-ff push, race with a
      # concurrent run) does not fail the job or block the status check below.
      # Ref runs (patched checkout) are skipped: their numbers are not a
      # released version's snapshot and must not claim the v<version> slot.
      - name: Store criterion results to benches-results/v<smartcore>/
        id: store
        if: inputs.smartcore_ref == ''
        continue-on-error: true
        env:
          SMARTCORE_VER: ${{ steps.smver.outputs.version }}
        run: |
          set -e
          dir="benches-results/v${SMARTCORE_VER}"
          # checkout@v4 leaves us detached at the trigger SHA; re-sync to
          # origin/main so a concurrent run's storage commit is visible and
          # our idempotent guard sees it.
          git fetch origin main
          git checkout -B main origin/main
          if [ -f "$dir/criterion.json" ]; then
            echo "::notice::criterion results for v${SMARTCORE_VER} already stored — skipping"
            exit 0
          fi
          mkdir -p "$dir"
          cp bench-output/criterion.json "$dir/criterion.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir/criterion.json"
          git commit -m "bench(criterion): record v${SMARTCORE_VER} results [skip ci]"
          # Retry once on non-ff rejection (concurrent run pushed between
          # our fetch and push); re-sync + re-check idempotency first.
          for attempt in 1 2; do
            if git push origin main; then
              echo "::notice::Stored criterion results to $dir/"
              exit 0
            fi
            echo "push attempt $attempt failed; re-syncing..."
            git fetch origin main
            git checkout -B main origin/main
            if [ -f "$dir/criterion.json" ]; then
              echo "::notice::criterion results for v${SMARTCORE_VER} were stored by a concurrent run — skipping"
              exit 0
            fi
            cp bench-output/criterion.json "$dir/criterion.json"
            git add "$dir/criterion.json"
            git commit -m "bench(criterion): record v${SMARTCORE_VER} results [skip ci]"
          done
          echo "::warning::Failed to push criterion storage after 2 attempts; next run will retry" >&2
          exit 1

      # Post a status check back to the smartcore commit that triggered the
      # run, so that repo's branch protection can see a benches result.
      # repository_dispatch carries the SHA in its payload; a ref run takes
      # it from the Resolve smartcore commit SHA step. The `||` picks the
      # payload when the resolve step was skipped (and vice versa).
      # continue-on-error: posting the cross-repo status needs the
      # BENCHES_STATUS_PAT secret; a missing token must not fail the
      # measurement run (it has never been configured — the first ref run
      # failed here). Admins: add the secret to restore status posting.
      - name: Post status check back to smartcore
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.smartcore_ref != '')
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SMARTCORE_SHA: ${{ steps.smartref.outputs.sha || github.event.client_payload.sha }}
        with:
          github-token: ${{ secrets.BENCHES_STATUS_PAT }}
          script: |
            const sha = process.env.SMARTCORE_SHA;
            if (!sha) {
              core.warning('no smartcore SHA to report; skipping status check');
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: 'smartcorelib',
              repo: 'smartcore',
              sha,
              state: 'success',
              context: 'smartcore-benches / criterion',
              description: 'Criterion bench run completed (advisory)',
              target_url: runUrl,
            });

  # Deterministic instruction-count gate. Linux-only (Valgrind). Counts retired
  # instructions, which are machine-independent, so a tight alert threshold is
  # safe even on GitHub-hosted runners. This is the job that can fail a merge.
  iai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional ref run: bench a smartcore branch/SHA instead of the
      # crates.io release. Trigger with, e.g.:
      #   gh workflow run bench.yml -f smartcore_ref=main
      # actions/checkout requires paths under $GITHUB_WORKSPACE, so the
      # checkout lands at ./smartcore and a [patch.crates-io] override
      # repoints the dep to it (config paths resolve relative to the
      # project root that owns .cargo/config.toml). Same trick as
      # smartcore's release-bench.yml. The ref's version must satisfy
      # Cargo.toml's `smartcore = "0.6"` or cargo rejects the patch.
      - name: Checkout smartcore at ${{ inputs.smartcore_ref }}
        if: inputs.smartcore_ref != ''
        uses: actions/checkout@v4
        with:
          repository: smartcorelib/smartcore
          ref: ${{ inputs.smartcore_ref }}
          path: smartcore

      # The status check below reports this SHA back to the smartcore commit.
      - name: Resolve smartcore commit SHA
        id: smartref
        if: inputs.smartcore_ref != ''
        run: echo "sha=$(git -C smartcore rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Repoint smartcore dep to the local checkout
        if: inputs.smartcore_ref != ''
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFG'
          [patch.crates-io]
          smartcore = { path = "smartcore" }
          CFG
          # The patch must satisfy Cargo.toml's version requirement or cargo
          # leaves it unused and silently benches the crates.io release
          # ("patch was not used in the crate graph"). Relax the requirement
          # to the ref's major.minor before building.
          ref_mm=$(sed -nE 's/^version = "([0-9]+\.[0-9]+)\.[0-9]+.*$/\1/p' smartcore/Cargo.toml | head -1)
          if [ -z "$ref_mm" ]; then
            echo "::error::could not read smartcore version from smartcore/Cargo.toml" >&2
            exit 1
          fi
          sed -i -E "s/(smartcore = \{ version = \")([^\"]+)(\")/\1${ref_mm}\3/" Cargo.toml
          echo "::notice::Patched smartcore version requirement to ${ref_mm} for the ref run"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: bench-iai-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: bench-iai-

      # Compile first so Cargo.lock exists (it's gitignored — not committed),
      # and a compile failure fails the job without spending runner minutes
      # on installing the runner or running Valgrind. The runner binary is
      # only needed at run time, not to build the bench crate.
      - name: Build iai benches (no-run)
        run: cargo bench --no-run --bench iai_matmul --bench iai_ab --bench iai_svd --bench iai_cover_tree --bench iai_iterator_mut --bench iai_random_forest_regressor --bench iai_lasso --bench iai_elastic_net

      # iai-callgrind 0.14 splits the runtime into a separate
      # `iai-callgrind-runner` binary that `cargo bench` does NOT install.
      # Without it the bench binary fails with "No such file or directory
      # (os error 2)" and produces no JSON, which then surfaces as a
      # misleading "Unexpected end of JSON input" parse error in the
      # benchmark-action step below. Install the runner at the version
      # Cargo.lock pins (must match the `iai-callgrind` lib dep). The
      # `if ! command -v` guard skips the ~1m install when the cache
      # already restored `~/.cargo/bin/iai-callgrind-runner`.
      - name: Install iai-callgrind-runner
        run: |
          if command -v iai-callgrind-runner >/dev/null 2>&1; then
            echo "::notice::iai-callgrind-runner already on PATH; skipping install"
            exit 0
          fi
          ver=$(grep -A1 '^name = "iai-callgrind-runner"$' Cargo.lock | grep version | sed -E 's/version = "([^"]+)".*/\1/')
          if [ -z "$ver" ]; then
            echo "::error::could not resolve iai-callgrind-runner version from Cargo.lock" >&2
            exit 1
          fi
          echo "::notice::Installing iai-callgrind-runner v$ver"
          cargo install iai-callgrind-runner --version "$ver" --locked

      # Run each iai bench. iai-callgrind's `--output-format=json` emits one
      # BenchmarkSummary object per benchmark line on stdout (NDJSON); we
      # append every bench crate's output into one iai.ndjson so the adapter
      # below sees the whole suite as a single stream.
      - name: Run iai-callgrind benchmarks
        run: |
          mkdir -p bench-output
          : > bench-output/iai.ndjson
          for b in iai_matmul iai_ab iai_svd iai_cover_tree iai_iterator_mut iai_random_forest_regressor iai_lasso iai_elastic_net; do
            echo "::group::running $b"
            cargo bench --bench "$b" -- --output-format=json >> bench-output/iai.ndjson
            echo "::endgroup::"
          done

      # Convert the NDJSON (one BenchmarkSummary per line) into the JSON
      # array benchmark-action's `customSmallerIsBetter` tool expects:
      # [{"name","unit":"Instructions","value"}] projecting the Ir (instructions
      # retired) `Left`/`Both[0]` metric. The adapter is stdlib-only Python.
      - name: Convert iai NDJSON to benchmark-action array
        run: python3 scripts/iai_to_benchmark_action.py bench-output/iai.ndjson bench-output/iai.json

      # iai-callgrind emits instruction counts (smaller = better), which
      # benchmark-action's `customSmallerIsBetter` tool shape accepts. The
      # action's v1 API does not have a dedicated `iai-callgrind` tool key,
      # so we map the JSON through the custom-smaller path. Instruction
      # counts are deterministic, so a 104% threshold (a >4% Ir regression)
      # fails the job (and the status check posted below). Note ref runs
      # (smartcore_ref) append to the same history, so the comparison
      # baseline may be a smartcore ref rather than the crates.io release.
      - name: Store + chart iai benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: bench-output/iai.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: iai-dev
          comment-on-alert: true
          fail-on-alert: true
          alert-threshold: "104%"

      - name: Upload iai JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iai-json
          path: |
            bench-output/iai.ndjson
            bench-output/iai.json
            bench-output/iai_*.json

      # Post a pass/fail status check back to the smartcore commit. Runs on
      # both success and failure so branch protection sees the real outcome.
      # `context.job` is the job NAME, not the conclusion, so the real
      # outcome is passed in via `job.status` (correct inside an always()
      # step). repository_dispatch carries the SHA in its payload; a ref
      # run takes it from the Resolve smartcore commit SHA step. The `||`
      # picks the payload when the resolve step was skipped (and vice versa).
      - name: Post status check back to smartcore
        if: always() && (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.smartcore_ref != ''))
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SMARTCORE_SHA: ${{ steps.smartref.outputs.sha || github.event.client_payload.sha }}
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.BENCHES_STATUS_PAT }}
          script: |
            const sha = process.env.SMARTCORE_SHA;
            if (!sha) {
              core.warning('no smartcore SHA to report; skipping status check');
              return;
            }
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            const desc = state === 'success'
              ? 'iai-callgrind instruction counts within threshold'
              : 'iai-callgrind regression detected (>4% on an instruction count)';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: 'smartcorelib',
              repo: 'smartcore',
              sha,
              state,
              context: 'smartcore-benches / iai-callgrind',
              description: desc,
              target_url: runUrl,
            });