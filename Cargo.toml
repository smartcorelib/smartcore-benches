[package]
name = "smartcore-benches"
description = "Benches for smartcore"
homepage = "https://smartcorelib.org"
version = "0.1.0"
authors = ["SmartCore Developers"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
documentation = "https://docs.rs/smartcore"
repository = "https://github.com/smartcorelib/smartcore-benches"
readme = "README.md"
keywords = ["machine-learning", "statistical", "ai", "optimization", "linear-algebra"]
categories = ["science"]

[dependencies]
# CI resolves smartcore from crates.io (`version = "0.6"` pulls the latest
# 0.6.x release — currently 0.6.2, edition 2024, ndarray 0.17, rand 0.10).
#
# For local dev against a sibling smartcore checkout, temporarily swap this
# line for: smartcore = { path = "../smartcore", features = ["ndarray-bindings"] }
smartcore = { version = "0.6", features = ["ndarray-bindings"] }
# Dependency versions mirror smartcore's Cargo.toml so cargo unifies a single
# version of each across the graph (avoids two `ndarray`/`rand` copies).
itertools = "0.15.0"
ndarray = "0.17"
rand = { version = "0.10.1", default-features = false, features = ["alloc"] }

# Bench harness. criterion = advisory wall-clock + statistics (local + CI).
# iai-callgrind = deterministic instruction-count gate (Linux/Valgrind only).
[dependencies.criterion]
version = "0.5"
default-features = false

[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.14"

[[bench]]
name = "distance"
harness = false

[[bench]]
name = "fastpair"
harness = false

[[bench]]
name = "linear"
harness = false

[[bench]]
name = "naive_bayes"
harness = false

[[bench]]
name = "svc"
harness = false

[[bench]]
name = "matmul"
harness = false

[[bench]]
name = "ab"
harness = false

[[bench]]
name = "svd"
harness = false

[[bench]]
name = "cover_tree"
harness = false

[[bench]]
name = "iterator_mut"
harness = false

# iai-callgrind benches: Linux-only (Valgrind). The `#[cfg(not(target_os =
# "linux"))]` fallback `fn main()` stub lets them compile on every platform
# so `cargo bench --no-run` stays a portable gate, but the actual Valgrind
# run happens only in the iai CI job (see .github/workflows/bench.yml).
[[bench]]
name = "iai_matmul"
harness = false

[[bench]]
name = "iai_ab"
harness = false

[[bench]]
name = "iai_svd"
harness = false

[[bench]]
name = "iai_cover_tree"
harness = false

[[bench]]
name = "iai_iterator_mut"
harness = false